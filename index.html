<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الدرجات والحضور</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a73e8;
            text-align: center;
        }
        .status-box {
            padding: 12px;
            background-color: #e8f0fe;
            border-right: 4px solid #1a73e8;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>نظام إدارة الدرجات والحضور</h1>
        <div id="status" class="status-box">جاري جلب البيانات من قاعدة البيانات...</div>

        <h3>قائمة الطلاب:</h3>
        <ul id="students-list"></ul>
    </div>

    <!-- Firebase Web SDK (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروع Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyDGNWlqFYVu_Cq2cYrdQjD7u820gz-yilE",
            authDomain: "school-grades-system-551ae.firebaseapp.com",
            projectId: "school-grades-system-551ae",
            storageBucket: "school-grades-system-551ae.firebasestorage.app",
            messagingSenderId: "327304394262",
            appId: "1:327304394262:web:7f2fed8966c9dc521ae737",
            measurementId: "G-81GCKTP9Z0"
        };

        // تهيئة الاتصال بقاعدة البيانات
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جلب البيانات وعرضها في الصفحة وفي Console المتصفح
        async function fetchStudents() {
            const statusDiv = document.getElementById("status");
            const studentsList = document.getElementById("students-list");

            try {
                console.log("جاري الاتصال بقاعدة البيانات...");
                const querySnapshot = await getDocs(collection(db, "students"));

                if (querySnapshot.empty) {
                    statusDiv.innerText = "تم الاتصال بنجاح، ولكن لم يتم العثور على أي طلاب في قاعدة البيانات.";
                    return;
                }

                statusDiv.innerText = "تم الاتصال بنجاح بنظام Firebase!";
                studentsList.innerHTML = "";

                querySnapshot.forEach((doc) => {
                    const student = doc.data();
                    console.log("بيانات الطالب:", student);

                    const li = document.createElement("li");
                    li.innerHTML = `<span><strong>الاسم:</strong> ${student.name || 'غير محدد'}</span> <span><strong>الكود:</strong> ${student.code || '-'}</span> <span><strong>الشعبة:</strong> ${student.section || '-'}</span>`;
                    studentsList.appendChild(li);
                });
            } catch (error) {
                console.error("خطأ أثناء الاتصال بقاعدة البيانات:", error);
                statusDiv.innerText = "حدث خطأ أثناء الاتصال بقاعدة البيانات. تحقق من Console المتصفح للتفاصيل.";
            }
        }

        // تشغيل الدالة فور تحميل الصفحة
        fetchStudents();
    </script>
</body>
</html>
