<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة درجات وحضور الطلاب</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 1100px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .status-bar { background: #eef2f5; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; color: #34495e; margin-bottom: 20px; border: 1px solid #dcdfe3; }
        .control-panel { display: flex; flex-wrap: wrap; gap: 15px; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eaeaea; margin-bottom: 20px; align-items: center; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
        label { margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #219150; }
        .btn-attendance { background-color: #2980b9; }
        .btn-attendance:hover { background-color: #1f6391; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .student-info-card { background: #e8f8f5; border-right: 5px solid #1abc9c; padding: 12px; margin-bottom: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>نظام إدارة درجات وحضور الطلاب المباشر</h2>
    
    <div id="fileStatus" class="status-bar">⏳ اختر الشعبة لبدء المزامنة...</div>

    <!-- شريط التحكم واختيار الشعبة -->
    <div class="control-panel">
        <div class="form-group">
            <label>اختر الشعبة:</label>
            <select id="selectSectionFilter" onchange="onSectionChange()">
                <option value="الشعبة أ">الشعبة أ</option>
                <option value="الشعبة ب">الشعبة ب</option>
                <option value="الشعبة ج">الشعبة ج</option>
                <option value="الشعبة د">الشعبة د</option>
                <option value="الكل">جميع الشعب</option>
            </select>
        </div>
        <div class="form-group">
            <label>بحث (اسم أو كود الطالب):</label>
            <input type="text" id="searchBox" placeholder="اكتب للاستعلام..." oninput="searchStudent()">
        </div>
        <button onclick="fetchSectionData(document.getElementById('selectSectionFilter').value)">🔄 تحديث البيانات</button>
    </div>

    <!-- بطاقة معلومات الطالب المحدد -->
    <div id="studentCard" class="student-info-card">
        <strong>الطالب الحالي: </strong> <span id="lblStudentName">---</span> | 
        <strong>الكود: </strong> <span id="lblStudentCode">---</span> | 
        <strong>الشعبة: </strong> <span id="lblStudentSection">---</span>
    </div>

    <!-- نموذج رصد الدرجات -->
    <div class="control-panel" id="gradePanel">
        <div class="form-group">
            <label>المادة:</label>
            <select id="selectSubject">
                <option value="القواعد والإملاء">القواعد والإملاء</option>
                <option value="الإنشاء">الإنشاء</option>
                <option value="الادب والمطالعة">الادب والمطالعة</option>
                <option value="النشاط">النشاط (تراكمي)</option>
                <option value="نصف السنة">نصف السنة</option>
            </select>
        </div>
        <div class="form-group">
            <label>الشهر / الفترة:</label>
            <select id="selectMonth">
                <option value="الشهر الأول">الشهر الأول</option>
                <option value="الشهر الثاني">الشهر الثاني</option>
                <option value="الشهر الثالث">الشهر الثالث</option>
                <option value="الشهر الرابع">الشهر الرابع</option>
            </select>
        </div>
        <div class="form-group">
            <label>الدرجة المدخلة:</label>
            <input type="number" id="inputGradeValue" placeholder="أدخل الدرجة" onkeydown="if(event.key==='Enter') saveDirectGrade()">
        </div>
        <button onclick="saveDirectGrade()">💾 حفظ الدرجة بالشيت</button>
        <button class="btn-attendance" onclick="openAttendanceModal()">📅 تسجيل حضور / غياب</button>
    </div>

    <!-- جدول عرض الدرجات -->
    <table id="gradesTable">
        <thead>
            <tr>
                <th>الفترة</th>
                <th>قواعد</th>
                <th>إنشاء</th>
                <th>أدب</th>
                <th>نشاط</th>
                <th>المجموع / السعي</th>
            </tr>
        </thead>
        <tbody id="gradesTableBody">
            <tr><td colspan="6">اختر طالباً من البحث لعرض درجاته المفصلة</td></tr>
        </tbody>
    </table>
</div>

<script>
    // رابط السكربت الخاص بك والمربوط بالنظام
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFceLoGl_86wxbiGx7f6zkwbBjVTkQNoe2hjKhSnFBMZZMTBzABqYdDzfJsEMn49JVkw/exec";

    let globalData = [];
    let currentStudentIndex = -1;

    window.onload = function() {
        onSectionChange();
    };

    function onSectionChange() {
        const sec = document.getElementById('selectSectionFilter').value;
        fetchSectionData(sec);
    }

    // جلب بيانات الشعبة المحددة فقط بسرعة فائقة
    function fetchSectionData(sectionName) {
        document.getElementById('fileStatus').innerText = `⏳ جاري جلب ومزامنة (${sectionName})...`;
        
        fetch(`${WEB_APP_URL}?section=${encodeURIComponent(sectionName)}`)
            .then(res => res.json())
            .then(data => {
                globalData = data;
                document.getElementById('fileStatus').innerText = `🌐 متصل - تم تحميل (${data.length}) طالب من ${sectionName}`;
                clearStudentView();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('fileStatus').innerText = "❌ فشل الاتصال بالخادم";
            });
    }

    // البحث عن الطالب محلياً في القائمة المجلوبة
    function searchStudent() {
        const query = document.getElementById('searchBox').value.trim().toLowerCase();
        if (!query) return;

        const idx = globalData.findIndex(s => 
            (s['اسم الطالب'] && s['اسم الطالب'].toLowerCase().includes(query)) || 
            (s['كود الطالب'] && s['كود الطالب'].toLowerCase() === query)
        );

        if (idx !== -1) {
            currentStudentIndex = idx;
            const s = globalData[idx];
            
            document.getElementById('studentCard').style.display = 'block';
            document.getElementById('lblStudentName').innerText = s['اسم الطالب'];
            document.getElementById('lblStudentCode').innerText = s['كود الطالب'];
            document.getElementById('lblStudentSection').innerText = s['الشعبة'];

            displayStudentGrades(s);
        }
    }

    // عرض درجات الطالب بالجدول
    function displayStudentGrades(s) {
        const tbody = document.getElementById('gradesTableBody');
        tbody.innerHTML = `
            <tr><td>الشهر الأول</td><td>${s['قواعد_1']}</td><td>${s['انشاء_1']}</td><td>${s['ادب_1']}</td><td>${s['نشاط_1']}</td><td><strong>${s['الشهر الأول']}</strong></td></tr>
            <tr><td>الشهر الثاني</td><td>${s['قواعد_2']}</td><td>${s['انشاء_2']}</td><td>${s['ادب_2']}</td><td>${s['نشاط_2']}</td><td><strong>${s['الشهر الثاني']}</strong></td></tr>
            <tr><td>سعي الفصل الأول</td><td colspan="4">---</td><td><strong>${s['سعي الفصل الأول']}</strong></td></tr>
            <tr><td>نصف السنة</td><td colspan="4">---</td><td><strong>${s['نصف_السنة']}</strong></td></tr>
            <tr><td>الشهر الثالث</td><td>${s['قواعد_3']}</td><td>${s['انشاء_3']}</td><td>${s['ادب_3']}</td><td>${s['نشاط_3']}</td><td><strong>${s['الشهر الثالث']}</strong></td></tr>
            <tr><td>الشهر الرابع</td><td>${s['قواعد_4']}</td><td>${s['انشاء_4']}</td><td>${s['ادب_4']}</td><td>${s['نشاط_4']}</td><td><strong>${s['الشهر الرابع']}</strong></td></tr>
            <tr><td>السعي السنوي</td><td colspan="4">---</td><td><strong style="color:blue;">${s['السعي السنوي']}</strong></td></tr>
        `;
    }

    // حفظ الدرجة المباشر والمؤكد بالشيت
    function saveDirectGrade() {
        if (currentStudentIndex === -1) {
            alert("يرجى البحث عن الطالب واختياره أولاً!");
            return;
        }

        const gradeValInput = document.getElementById('inputGradeValue').value;
        const selectedSubject = document.getElementById('selectSubject').value;
        const selectedMonth = document.getElementById('selectMonth').value;

        if (gradeValInput === "") {
            alert("يرجى إدخال قيمة الدرجة!");
            return;
        }

        const gradeVal = parseFloat(gradeValInput);
        let s = globalData[currentStudentIndex];

        document.getElementById('fileStatus').innerText = "⏳ جاري حفظ وتأكيد الدرجة في Google Sheets...";

        postData({
            action: "saveGrade",
            sheetName: s['__sheetName'],
            rowIndex: s['__rowIndex'],
            subject: selectedSubject,
            month: selectedMonth,
            gradeVal: gradeVal
        })
        .then(result => {
            if (result.success || result.status === "success") {
                document.getElementById('fileStatus').innerText = "🌐 تم الحفظ الفعلي وتأكيد الشيت بنجاح";
                
                // إعادة قراءة الشعبة الحالية لضمان تحديث المعادلات والمجاميع بدقة 100%
                fetchSectionData(s['الشعبة']);
                
                document.getElementById('inputGradeValue').value = '';
                document.getElementById('searchBox').focus();
            } else {
                alert("حدث خطأ أثناء الحفظ: " + (result.message || "خطأ غير معروف"));
                document.getElementById('fileStatus').innerText = "❌ فشل حفظ الدرجة";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("فشل الاتصال بالخادم أثناء عملية الحفظ!");
            document.getElementById('fileStatus').innerText = "❌ خطأ في الاتصال";
        });
    }

    function postData(data) {
        return fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data)
        }).then(res => res.json());
    }

    function clearStudentView() {
        currentStudentIndex = -1;
        document.getElementById('studentCard').style.display = 'none';
        document.getElementById('gradesTableBody').innerHTML = '<tr><td colspan="6">اختر طالباً من البحث لعرض درجاته المفصلة</td></tr>';
    }

    function openAttendanceModal() {
        if (currentStudentIndex === -1) {
            alert("يرجى اختيار طالب أولاً لتسجيل الحضور!");
            return;
        }
        let s = globalData[currentStudentIndex];
        let status = prompt(`تسجيل حضور للطالب: (${s['اسم الطالب']})\nاكتب أحد الخيارات: (حاضر / غائب / مجاز / متاخر)`, "حاضر");
        
        if (status) {
            let today = new Date().toISOString().split('T')[0];
            postData({
                action: "saveAttendance",
                studentCode: s['كود الطالب'],
                studentName: s['اسم الطالب'],
                date: today,
                status: status
            }).then(res => {
                alert(res.message || "تم تسجيل الحضور بنجاح");
            });
        }
    }
</script>
</body>
</html>
